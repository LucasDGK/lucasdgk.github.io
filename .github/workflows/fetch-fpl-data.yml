name: Fetch FPL Data

# This is the *fallback* source for the dashboard. Freshness comes from the
# Cloudflare Worker in worker/, because GitHub delivers scheduled runs every two
# to five hours no matter what interval you ask for, which is useless during a
# match. The committed data.json only exists so the TV shows something if the
# worker is unreachable, so an hourly attempt is plenty.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/fetch-fpl-data.yml'
      - '.github/scripts/fetch_fpl.py'

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch FPL data
        run: python .github/scripts/fetch_fpl.py

      - name: Commit and push updated data
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git add fpl/data.json
          git diff --staged --quiet || (
            git commit -m "chore: update FPL data [skip ci]" && git push
          )
