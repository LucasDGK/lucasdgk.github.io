name: Fetch FPL Data

# GitHub does not honour a */5 schedule: in practice the runs arrived every two
# to six hours. So we ask for a slow schedule, which is delivered reliably, and
# each run then refreshes on a loop of its own until the next one is due.
on:
  schedule:
    # Every half hour, off the hour to avoid the busiest scheduling slots.
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/fetch-fpl-data.yml'
      - '.github/scripts/fetch_fpl.py'
      - '.github/scripts/should_keep_polling.py'

# If a run is still looping when the next schedule fires, the newcomer wins:
# two loops committing at once would just fight over the push.
concurrency:
  group: fetch-fpl-data
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The loop below stops itself; this is only a backstop against a hung run.
    timeout-minutes: 35

    env:
      # How long a run keeps refreshing before it hands over to the next one.
      LOOP_MINUTES: 29
      # Refresh cadence while a match is in play.
      INTERVAL_LIVE_S: 180
      # Start looping this early so the first goals of a match are not missed.
      KICKOFF_LOOKAHEAD_MIN: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Refresh data on a loop
        run: |
          set -uo pipefail

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"

          deadline=$(( $(date +%s) + LOOP_MINUTES * 60 ))

          while :; do
            python .github/scripts/fetch_fpl.py || echo "::warning::fetch failed, will retry"

            git add fpl/data.json
            if git diff --staged --quiet; then
              echo "no change"
            else
              git commit -m "chore: update FPL data [skip ci]"
              # A previous push may have landed meanwhile (or a cancelled run
              # left the branch ahead), so rebase before retrying.
              git push || (git pull --rebase --autostash && git push)
            fi

            # Only keep the runner busy while points can actually move; outside a
            # match window one fetch per scheduled run is plenty.
            if ! python .github/scripts/should_keep_polling.py; then
              echo "nothing in play, leaving the rest to the next scheduled run"
              break
            fi

            now=$(date +%s)
            remaining=$(( deadline - now ))
            # Stop rather than start a cycle that would outlive this run.
            [ "$remaining" -le "$INTERVAL_LIVE_S" ] && { echo "handing over to next run"; break; }

            sleep "$INTERVAL_LIVE_S"
          done
