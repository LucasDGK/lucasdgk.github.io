<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ceremony</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; }
    body { overflow: hidden; }

    .ceremony-image {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    #fireworks-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <img class="ceremony-image" src="../assets/league_results.png" alt="League Results">
  <canvas id="fireworks-canvas" aria-hidden="true"></canvas>

  <script src="../fpl/assets/js/champion.js"></script>
</body>
</html>
